name: Blender pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/blender-pipeline.yml"
      - ".gitignore"
      - "requirements.txt"
      - "skills/blender-pipeline/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blender-pipeline.yml"
      - ".gitignore"
      - "requirements.txt"
      - "skills/blender-pipeline/**"

permissions:
  contents: read

concurrency:
  group: blender-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate standalone skill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Show Python runtime
        run: python --version

      - name: Install pipeline test dependencies
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4
          python -m pip install --disable-pip-version-check \
            -r skills/blender-pipeline/generation/requirements.txt
          python -m pip install --disable-pip-version-check \
            -e 'skills/blender-pipeline/editing[test]'

      - name: Compile Python sources
        run: python3 -Werror -m compileall -q skills/blender-pipeline

      - name: Check Python quality
        run: |
          ruff check skills/blender-pipeline \
            --select F,E9,EXE001,EXE002,EXE003,EXE004,EXE005
          ruff format --check skills/blender-pipeline

      - name: Validate package and knowledge contracts
        run: |
          python skills/blender-pipeline/scripts/validate_package.py
          python -m unittest discover \
            -s skills/blender-pipeline/tests \
            -p "test_*.py" \
            -v

      - name: Test from-zero generation pipeline
        run: |
          python -m unittest discover \
            -s skills/blender-pipeline/generation/tests \
            -p "test_*.py" \
            -v

      - name: Test showcase reproduction contracts
        run: |
          python -m unittest discover \
            -s skills/blender-pipeline/reproduction/tests \
            -p "test_*.py" \
            -v

      - name: Test existing-asset editing pipeline
        env:
          PYTHONPATH: skills/blender-pipeline/editing/src
        run: |
          python -m unittest discover \
            -s skills/blender-pipeline/editing/tests \
            -p "test_*.py" \
            -v
